spring:
  application:
    name: url-shortener
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health